name: Deploy site to GitHub Pages

# Builds the site artifact with secrets injected as assets/app-config.js and
# publishes it. index.html and the public repository never contain API keys.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate assets/app-config.js from repository secrets
        env:
          SEAL_SECRET: ${{ secrets.SEAL_SECRET }}
          SEAL_KEY_ID: ${{ secrets.SEAL_KEY_ID }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          mkdir -p _site/assets _site/data
          python3 - <<'PY'
          import json, os, re, secrets as pysecrets
          seal = os.environ.get("SEAL_SECRET") or pysecrets.token_hex(32)
          if not os.environ.get("SEAL_SECRET"):
              print("WARNING: SEAL_SECRET not set — generated an ephemeral one for this build.")
          fb = None
          raw = os.environ.get("FIREBASE_CONFIG_JSON", "").strip()
          if raw:
              try:
                  fb = json.loads(raw)
              except Exception:
                  # Accept a pasted JS object literal (const firebaseConfig = {…};)
                  # with unquoted keys and/or trailing commas — normalize to JSON.
                  m = re.search(r"\{.*\}", raw, re.S)
                  t = re.sub(r"([{,]\s*)([A-Za-z_][A-Za-z0-9_]*)\s*:", r'\1"\2":', m.group(0) if m else raw)
                  t = re.sub(r",\s*([}\]])", r"\1", t)
                  fb = json.loads(t)
              if not isinstance(fb, dict) or not fb.get("apiKey"):
                  print("WARNING: FIREBASE_CONFIG_JSON has no apiKey — provider sign-in stays disabled.")
                  fb = None
              else:
                  print("FIREBASE_CONFIG_JSON parsed — provider sign-in enabled ( authDomain:",
                        fb.get("authDomain", "?"), ")")
          cfg = {
              "adminEmail": os.environ.get("ADMIN_EMAIL") or "",
              "sealSecret": seal,
              "sealKeyId": os.environ.get("SEAL_KEY_ID") or "d1",
              "firebase": fb,
          }
          js = "/* GENERATED at deploy time from repository secrets — do not edit or commit */\nwindow.APP_CONFIG = " + json.dumps(cfg) + ";\n"
          with open("_site/assets/app-config.js", "w") as f:
              f.write(js)
          print("app-config.js written | firebase:", "yes" if fb else "not configured (on-device accounts only)")
          PY
          cp index.html _site/
          cp robots.txt sitemap.xml _site/ 2>/dev/null || true
          cp sw.js _site/ 2>/dev/null || true
          cp manifest.webmanifest _site/ 2>/dev/null || true
          cp assets/icon-192.png assets/icon-512.png _site/assets/ 2>/dev/null || true
          cp assets/app-config.sample.js _site/assets/ 2>/dev/null || true
          cp -r data/. _site/data/ 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
